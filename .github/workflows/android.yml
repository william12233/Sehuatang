name: Android CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: 建置 Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 取得原始碼
        uses: actions/checkout@v4

      - name: 設定 Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: 設定 Android SDK
        shell: bash
        run: |
          set -e
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          test -n "$sdk_root"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          export PATH="$sdk_root/cmdline-tools/latest/bin:$sdk_root/platform-tools:$PATH"
          command -v sdkmanager
          sdkmanager --version

      - name: 安裝必要 SDK 套件
        shell: bash
        run: |
          set -e
          set +o pipefail
          yes | sdkmanager --licenses >/dev/null
          set -o pipefail
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: 授予 Wrapper 執行權限
        run: chmod +x ./gradlew

      - name: 執行單元測試並建置 Debug
        run: ./gradlew testDebugUnitTest compileDebugAndroidTestKotlin assembleDebug --stacktrace --no-daemon

      - name: 上傳 Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sehuatang-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
